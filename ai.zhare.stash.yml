# Flatpak manifest for Stash (app ID ai.zhare.stash), prebuilt binary route.
# The app tree is downloaded at install time from the Zhare.ai host (extra-data) and
# checked against the pinned sha256, so no source archive is published. The world
# files stay a Flathub-built extension. The APP_ and WORLDS_ placeholders are filled by
# scripts/extradata-bundle.sh. See docs/store-setup/flathub.md.
id: ai.zhare.stash
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: stash-launch

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=network
  - --socket=pulseaudio

add-extensions:
  ai.zhare.stash.Worlds:
    directory: extensions/worlds
    autodownload: true
    autodelete: true

modules:
  - name: stash
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra /app/bin/apply_extra
      - install -Dm755 stash-launch /app/bin/stash-launch
      - install -d /app/extensions/worlds
      - install -Dm644 ai.zhare.stash.desktop /app/share/applications/ai.zhare.stash.desktop
      - install -Dm644 ai.zhare.stash.metainfo.xml /app/share/metainfo/ai.zhare.stash.metainfo.xml
      - install -Dm644 128x128.png /app/share/icons/hicolor/128x128/apps/ai.zhare.stash.png
      - install -Dm644 128x128@2x.png /app/share/icons/hicolor/256x256/apps/ai.zhare.stash.png
      - install -Dm644 512x512.png /app/share/icons/hicolor/512x512/apps/ai.zhare.stash.png
    sources:
      - type: extra-data
        filename: stash-app.tar.gz
        url: https://dl.zhare.ai/stash/v0.1.3611/stash-app.tar.gz
        sha256: 3b19c89fab6ae94276520f543a116dc07aea4b52edfb62cb20756f27f4dd375f
        size: 12461405
      - type: file
        path: apply_extra
      - type: file
        path: stash-launch
      - type: file
        path: ai.zhare.stash.desktop
      - type: file
        path: ai.zhare.stash.metainfo.xml
      - type: file
        path: 128x128.png
      - type: file
        path: 128x128@2x.png
      - type: file
        path: 512x512.png

  - name: worlds
    buildsystem: simple
    build-extension: true
    build-commands:
      - cp -a worlds/. "${FLATPAK_DEST}/"
    sources:
      - type: archive
        url: https://dl.zhare.ai/stash/v0.1.3611/stash-worlds.tar.zst
        sha256: 3e14d46f208022dd273008da57b0e3133683ad23ce62289cd0f449bb87b02187
        dest: worlds
